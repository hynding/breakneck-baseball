name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Quality gate: tests, dual-target checks, and lints (see ci.yml).
  # Nothing deploys to Pages unless this passes.
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry, build, and tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/.crates.toml
            ~/.cargo/bin/.crates2.json
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install wasm-bindgen-cli
        run: |
          WB_VERSION=$(cargo metadata --format-version 1 \
            | jq -r 'first(.packages[] | select(.name == "wasm-bindgen") | .version)')
          INSTALLED_VERSION=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || echo "")
          if [ "$WB_VERSION" != "$INSTALLED_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
          fi

      - name: Build WASM
        run: cargo build --profile wasm-release --target wasm32-unknown-unknown

      - name: Run wasm-bindgen
        run: |
          BIN_NAME=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg manifest "$GITHUB_WORKSPACE/Cargo.toml" \
              'first(.packages[] | select(.manifest_path == $manifest) | .targets[] | select(.kind[] == "bin") | .name)')
          if [ -z "$BIN_NAME" ]; then
            echo "Error: no binary target found in Cargo.toml" >&2
            exit 1
          fi
          wasm-bindgen \
            --out-dir web/out \
            --target web \
            "target/wasm32-unknown-unknown/wasm-release/${BIN_NAME}.wasm"

      - name: Optimize WASM (wasm-opt -Oz)
        id: wasmopt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen
          IN=web/out/breakneck-baseball_bg.wasm
          BEFORE=$(stat -c%s "$IN")
          # Rust ships these two proposals enabled by default; binaryen must
          # be told or it rejects the module.
          wasm-opt -Oz \
            --enable-bulk-memory --enable-nontrapping-float-to-int \
            --output "$IN.opt" "$IN"
          mv "$IN.opt" "$IN"
          AFTER=$(stat -c%s "$IN")
          echo "wasm-opt -Oz: $BEFORE -> $AFTER bytes"
          echo "wasm_size=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

    outputs:
      wasm_size: ${{ steps.wasmopt.outputs.wasm_size }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

  # A deploy that ships a broken or missing artifact must not pass silently:
  # verify the live site actually serves the page and the exact wasm we built.
  smoke-test:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-test live deployment
        run: |
          BASE="${{ needs.deploy.outputs.page_url }}"
          BASE="${BASE%/}"
          EXPECTED_SIZE="${{ needs.build.outputs.wasm_size }}"

          # Pages CDN propagation can lag the deploy step by a few seconds.
          for attempt in 1 2 3 4 5; do
            PAGE_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/")
            [ "$PAGE_CODE" = "200" ] && break
            echo "attempt $attempt: page returned $PAGE_CODE; retrying"
            sleep 15
          done
          [ "$PAGE_CODE" = "200" ] || { echo "page: expected 200, got $PAGE_CODE" >&2; exit 1; }
          echo "page: 200 OK"

          WASM_URL="$BASE/out/breakneck-baseball_bg.wasm"
          read -r CODE TYPE SIZE <<< "$(curl -s -o /dev/null \
            -w '%{http_code} %{content_type} %{size_download}' "$WASM_URL")"
          echo "wasm: $CODE $TYPE $SIZE bytes (expected $EXPECTED_SIZE)"
          [ "$CODE" = "200" ] || { echo "wasm: expected 200, got $CODE" >&2; exit 1; }
          case "$TYPE" in
            application/wasm*) ;;
            *) echo "wasm: expected application/wasm, got $TYPE" >&2; exit 1 ;;
          esac
          [ "$SIZE" = "$EXPECTED_SIZE" ] || {
            echo "wasm: size $SIZE != built artifact $EXPECTED_SIZE" >&2; exit 1; }
